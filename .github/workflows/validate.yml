name: Validation

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  hacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: hacs/action@main
        with:
          category: plugin

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: dist/ à jour
        run: git diff --exit-code dist/ || (echo "Lance npm run build et commite dist/." && exit 1)
