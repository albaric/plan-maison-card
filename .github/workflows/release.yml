name: Publication

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Joindre le fichier à la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/plan-maison-card.js --clobber
