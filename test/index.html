<!doctype html><html><head><meta charset="utf-8"><title>plan-maison-card — banc d'essai</title>
<style>body{margin:0;background:#111;padding:16px;font-family:sans-serif}</style>
<script>
customElements.define('ha-icon', class extends HTMLElement{ connectedCallback(){ this.style.cssText='display:inline-block;width:var(--mdc-icon-size,16px);height:var(--mdc-icon-size,16px);border-radius:3px;background:currentColor;opacity:.55'; } });
customElements.define('ha-card', class extends HTMLElement{ connectedCallback(){ this.style.display='block'; } });
</script>
</head><body><div id="host" style="max-width:1300px"></div>
<script type="module" src="../dist/plan-maison-card.js"></script>
<script type="module">
import * as jsyaml from '../node_modules/js-yaml/dist/js-yaml.mjs';
// Banc d'essai hors Home Assistant : faux objet hass + états fictifs.
const q = new URLSearchParams(location.search);
const S = (e, s, a={}) => [e, {entity_id:e, state:s, attributes:a, last_changed:new Date().toISOString()}];
const states = Object.fromEntries([
 S('light.lampe_canape','on'), S('switch.multiprise_sejour','on'), S('switch.prise_anti_moustiques','off'),
 S('sensor.coordinateur_zigbee_temperature','66.1',{unit_of_measurement:'°C'}), S('sensor.passerelle_radio_temperature','77.8',{unit_of_measurement:'°C'}),
 S('sensor.box_internet_debit_descendant','508',{unit_of_measurement:'kB/s'}), S('camera.sejour','idle'), S('sensor.sejour_temperature','23.8',{unit_of_measurement:'°C'}), S('sensor.sejour_humidite','75.1',{unit_of_measurement:'%'}),
 S('sensor.sejour_batterie','39',{unit_of_measurement:'%'}), S('binary_sensor.baie_sejour','off',{device_class:'door'}), S('climate.poele','unavailable'),
 S('binary_sensor.porte_entree_contact','on',{device_class:'door'}), S('switch.lumiere_entree','on'), S('binary_sensor.ecran_mural','on'), S('binary_sensor.ecran_mural_presence','off',{device_class:'occupancy'}),
 S('switch.vanne_arrosage_lave_vaisselle','off'), S('sensor.serveur_memoire','93',{unit_of_measurement:'%'}), S('device_tracker.imprimante','home'),
 S('sensor.salle_de_bain_temperature','23.2',{unit_of_measurement:'°C'}), S('sensor.salle_de_bain_humidite','81.5',{unit_of_measurement:'%'}), S('climate.salle_de_bain','off'),
 S('switch.guirlande_pergola','on'), S('switch.eclairage_salon_jardin','off'), S('light.guinguette','on'), S('light.guirlande_terrasse','off'),
 S('switch.spot_abri','off'), S('binary_sensor.porte_abri','off',{device_class:'door'}), S('sensor.onduleur_puissance','unavailable'),
 S('switch.prise_exterieure','on'), S('camera.jardin_nord','idle'), S('camera.jardin_est','idle'), S('switch.arrosage_1','off'), S('switch.arrosage_2','off'), S('switch.vanne_arrosage','off'),
 S('sensor.station_meteo_temperature', location.search.includes('storm')?'28.5':'12.4',{unit_of_measurement:'°C'}), S('sensor.temperature_ressentie','11.2',{unit_of_measurement:'°C'}), S('sensor.station_meteo_humidite','96',{unit_of_measurement:'%'}),
 S('sensor.station_meteo_pression','1016.2',{unit_of_measurement:'hPa'}), S('sensor.station_meteo_batterie','100',{unit_of_measurement:'%'}), S('sensor.pluviometre_aujourd_hui','2.1',{unit_of_measurement:'mm'}),
 S('sensor.pluviometre_hier','53.5',{unit_of_measurement:'mm'}), S('sensor.pluviometre_mois','115',{unit_of_measurement:'mm'}), S('sensor.anemometre_vitesse_moyenne', location.search.includes('storm')?'24':'3.4',{unit_of_measurement:'km/h'}),
 S('sensor.anemometre_rafale','7.9',{unit_of_measurement:'km/h'}), S('sensor.vigilance_meteo','Vert'), S('sensor.pluviometre_intensite', location.search.includes('storm')?'1.2':'0',{unit_of_measurement:'mm/h'}), S('sensor.probabilite_pluie','30',{unit_of_measurement:'%'}), S('sensor.indice_uv','2'),
 S('sensor.coordinateur_zigbee_connexion','wifi'), S('update.serveur_fichiers','on'), S('sensor.vanne_arrosage_batterie','57',{unit_of_measurement:'%'}), S('media_player.tv_chambre','unavailable'), S('light.ampoule_couleur','off')
,
 S('light.salon','on'), S('switch.prise_cuisine','off'), S('light.guirlande_terrasse','on'), S('sensor.exterieur_temperature','24.5',{unit_of_measurement:'°C',device_class:'temperature'}), S('sensor.exterieur_humidity','58',{unit_of_measurement:'%',device_class:'humidity'}), S('binary_sensor.porte_entree','off',{device_class:'door'}),
 S('sensor.telecommande_battery','12',{unit_of_measurement:'%',device_class:'battery',friendly_name:'Télécommande'}), S('update.home_assistant_core_update','on',{title:'Home Assistant Core',latest_version:'2026.10.1'})
]);
// registre fictif : un serveur et un capteur Zigbee avec leurs entités de diagnostic
const ago = (h) => new Date(Date.now() - h * 3600e3).toISOString();
Object.assign(states, Object.fromEntries([
 S('sensor.serveur_processeur','34',{unit_of_measurement:'%',friendly_name:'Serveur Processeur'}),
 S('sensor.serveur_disque','88',{unit_of_measurement:'%',friendly_name:'Serveur Disque /'}),
 S('sensor.serveur_temperature_cpu','61.5',{unit_of_measurement:'°C',device_class:'temperature',friendly_name:'Serveur Température CPU'}),
 S('sensor.serveur_dernier_demarrage',ago(80),{device_class:'timestamp',friendly_name:'Serveur Dernier démarrage'}),
 S('binary_sensor.serveur_connectivite','on',{device_class:'connectivity',friendly_name:'Serveur Connectivité'}),
 S('sensor.sejour_linkquality','35',{friendly_name:'Capteur séjour Linkquality',unit_of_measurement:'lqi'}),
 S('sensor.sejour_last_seen',ago(0.05),{device_class:'timestamp',friendly_name:'Capteur séjour Last seen'}),
 S('binary_sensor.coordinateur_zigbee_ethernet','off',{device_class:'connectivity',friendly_name:'SLZB-06 Ethernet'}), S('sensor.coordinateur_zigbee_wifi_rssi','-61',{device_class:'signal_strength',unit_of_measurement:'dBm',friendly_name:'SLZB-06 Wi-Fi RSSI'}),
]));
const reg = (dev, ids, cat) => ids.map((e) => [e, { entity_id: e, device_id: dev, entity_category: cat || null }]);
const entities = Object.fromEntries([
 ...reg('srv', ['sensor.serveur_memoire','sensor.serveur_processeur','sensor.serveur_disque','sensor.serveur_temperature_cpu','sensor.serveur_dernier_demarrage','binary_sensor.serveur_connectivite','update.serveur_fichiers'], 'diagnostic'),
 ...reg('slz', ['sensor.coordinateur_zigbee_temperature','sensor.coordinateur_zigbee_connexion']), ...reg('slz', ['binary_sensor.coordinateur_zigbee_ethernet','sensor.coordinateur_zigbee_wifi_rssi'], 'diagnostic'),
 ...reg('th', ['sensor.sejour_temperature','sensor.sejour_humidite']), ...reg('th', ['sensor.sejour_batterie','sensor.sejour_linkquality','sensor.sejour_last_seen'], 'diagnostic'),
]);
const devices = { srv: { name: 'Serveur', manufacturer: 'Proxmox', model: 'VM Home Assistant', sw_version: '16.2' }, th: { name: 'Capteur séjour', manufacturer: 'Aqara', model: 'WSDCGQ11LM' }, slz: { name: 'SLZB-06', manufacturer: 'SMLIGHT', model: 'SLZB-06' } };
window.calls=[]; window.store={};
const hass = { states, entities, devices, areas:{}, themes:{darkMode: location.hash==='#dark'},
  callService:(d,s,data)=>{ calls.push([d,s,data]); const e=data.entity_id; states[e]={...states[e], state: states[e].state==='on'?'off':'on'}; card.hass={...hass, states:{...states}}; },
  callWS:async(m)=>{ if(m.type==='frontend/get_user_data') return {value: store[m.key]||null}; if(m.type==='frontend/set_user_data'){ store[m.key]=JSON.parse(JSON.stringify(m.value)); return {}; } } };
await customElements.whenDefined('plan-maison-card');
const C = customElements.get('plan-maison-card');
const name = q.get('cfg') || 'complete';
let cfg = name === 'stub' ? C.getStubConfig() : jsyaml.load(await (await fetch('../examples/' + name + '.yaml')).text());
window.card = document.createElement('plan-maison-card');
try { card.setConfig(cfg); } catch (e) { document.getElementById('host').textContent = 'ERREUR CONFIG : ' + e.message; window.cfgError = e.message; throw e; }
document.getElementById('host').appendChild(card); card.hass = hass;
window.addEventListener('hass-more-info', e=>{ window.lastMore=e.detail.entityId; });
</script></body></html>
