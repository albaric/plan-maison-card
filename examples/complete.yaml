# Exemple complet : maison de plain-pied de 11 pièces, cloisons nommées, 38 équipements.
# Les cotes sont en mètres, origine au coin nord-ouest de la maison.
type: custom:plan-maison-card
title: Maison de démonstration
view: [-5, -6, 24, 21]

# Cloisons nommées : chaque nom devient une poignée en mode Murs.
axes:
  xS: {value: 4.1, label: "Séjour | chambre 1"}
  xM: {value: 4.1, label: "Séjour, repas | WC, cuisine"}
  xC1: {value: 7.3, label: "Chambre 1 | bureau"}
  xB: {value: 10.5, label: "Bureau | chambre 2"}
  xWC: {value: 6.8, label: "WC | douche"}
  xK: {value: 8, label: "Cuisine | salle de bain"}
  xE: {value: 10, label: "Salle de bain | couloir, chambre 3"}
  xCor: {value: 10.8, label: "Couloir | petite pièce"}
  xD: {value: 11.3, label: "Fin du dégagement"}
  yN1: {value: 3.12, label: "Chambre 1 | dégagement"}
  yNb: {value: 3.12, label: "Bureau | dégagement"}
  yN2: {value: 3.12, label: "Chambre 2 | dégagement"}
  yD: {value: 4, label: "Dégagement | WC, salle de bain"}
  yK: {value: 5.6, label: "WC | cuisine"}
  yKo: {value: 6.4, label: "Fin du muret cuisine"}
  yC3: {value: 5.6, label: "Couloir | chambre 3"}
  yR: {value: 6.1, label: "Séjour | coin repas"}
  xW: {value: 11.5, label: "Façade ouest du bas de la chambre 3"}

rooms:
  - id: sejour
    name: "Séjour"
    kind: jour
    area: 25
    label_size: 0.44
    points: [[0, 0], [xS, 0], [xS, yD], [xM, yD], [xM, yR], [0, yR]]
  - id: repas
    name: "Coin repas"
    kind: jour
    label_size: 0.28
    points: [[0, yR], [xM, yR], [xM, 10], [0, 10]]
  - id: ch1
    name: "Chambre 1"
    kind: nuit
    area: 10
    label_size: 0.32
    points: [[xS, 0], [xC1, 0], [xC1, yN1], [xS, yN1]]
  - id: bureau
    name: "Bureau"
    kind: service
    area: 10
    label_size: 0.32
    points: [[xC1, 0], [xB, 0], [xB, yNb], [xC1, yNb]]
  - id: ch2
    name: "Chambre 2"
    kind: nuit
    area: 14
    label_size: 0.32
    points: [[xB, 0], [15, 0], [15, yN2], [xB, yN2]]
  - id: degag
    name: "Dégagement"
    kind: circ
    label_size: 0.24
    points: [[xS, yN1], [xC1, yN1], [xC1, yNb], [xB, yNb], [xB, yN2], [xD, yN2], [xD, yD], [xCor, yD], [xCor, yC3], [xE, yC3], [xE, yD], [xS, yD]]
  - id: wc
    name: "WC"
    kind: eau
    label_size: 0.28
    points: [[xM, yD], [xWC, yD], [xWC, yK], [xM, yK]]
  - id: sdb
    name: "Salle de bain"
    kind: eau
    label_size: 0.23
    points: [[xWC, yD], [xE, yD], [xE, 10], [xK, 10], [xK, yK], [xWC, yK]]
  - id: cuisine
    name: "Cuisine"
    kind: jour
    label_size: 0.34
    points: [[xM, yK], [xK, yK], [xK, 10], [xM, 10]]
  - id: inconnu
    name: "À préciser"
    kind: todo
    label_size: 0.28
    points: [[xD, yN2], [15, yN2], [15, yC3], [xCor, yC3], [xCor, yD], [xD, yD]]
  - id: ch3
    name: "Chambre 3"
    kind: nuit
    label_size: 0.34
    points: [[xE, yC3], [15, yC3], [15, 11.5], [xW, 11.5], [xW, 10], [xE, 10]]

openings:
  - {type: door, from: [xC1-1.1, yN1], to: [xC1-0.3, yN1]}   # chambre 1
  - {type: door, from: [xB-1.1, yNb], to: [xB-0.4, yNb]}   # bureau
  - {type: door, from: [xB+0.1, yN2], to: [xB+0.8, yN2]}   # chambre 2
  - {type: door, from: [xM+0.3, yD], to: [xM+1, yD]}   # WC
  - {type: door, from: [xK+0.4, yD], to: [xK+1.1, yD]}   # salle de bain
  - {type: door, from: [xCor, yD+0.4], to: [xCor, yD+1.1]}   # petite pièce
  - {type: door, from: [xE+0.1, yC3], to: [xE+0.7, yC3]}   # chambre 3
  - {type: door, from: [2.4, 10], to: [3.3, 10], swing: up, label: Entrée}
  - {type: open, from: [xS, yN1], to: [xS, yD], dashed: false}   # séjour ouvert sur le dégagement
  - {type: open, from: [xS, yD], to: [xM, yD], dashed: false}
  - {type: open, from: [xM, yKo], to: [xM, 10], dashed: false}   # cuisine ouverte au-delà du muret
  - {type: open, from: [0, yR], to: [xM, yR]}   # séjour | coin repas
  - {type: window, from: [4.8, 0], to: [6, 0]}
  - {type: window, from: [8.3, 0], to: [9.5, 0]}
  - {type: window, from: [11.6, 0], to: [13, 0]}
  - {type: window, from: [0, 2.2], to: [0, 4.2]}
  - {type: window, from: [0.6, 10], to: [1.8, 10]}
  - {type: window, from: [5, 10], to: [6.2, 10]}
  - {type: window, from: [xW, 10.2], to: [xW, 11.2]}
  - {type: window, from: [15, 9.2], to: [15, 10.6]}

zones:
  - {id: pergola, name: Pergola, type: deck, rect: [-3, 1, 0, 6], pattern: slats, posts: true, show_size: true}
