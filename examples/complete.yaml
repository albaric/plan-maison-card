banner:
  - entity: sensor.station_meteo_temperature
    name: Température
    icon: mdi:thermometer
    color: temperature
    decimals: 1
    secondary: "ressenti {sensor.temperature_ressentie:1} °C"
  - entity: sensor.station_meteo_humidite
    name: Humidité
    icon: mdi:water-percent
    color: "#3e7bfa"
    decimals: 0
    secondary: station météo
  - entity: sensor.station_meteo_pression
    name: Pression
    icon: mdi:gauge
    color: "#8e6bd8"
    decimals: 1
    secondary: "pile station {sensor.station_meteo_batterie:0} %"
  - entity: sensor.pluviometre_aujourd_hui
    name: Pluie du jour
    icon: mdi:weather-rainy
    color: "#2bb3a3"
    decimals: 1
    secondary: "hier {sensor.pluviometre_hier:1} · mois {sensor.pluviometre_mois:1} mm"
  - entity: sensor.anemometre_vitesse_moyenne
    name: Vent moyen
    icon: mdi:weather-windy
    color: "#5aa0ff"
    decimals: 1
    secondary: "rafale {sensor.anemometre_rafale:1} km/h"
  - entity: sensor.vigilance_meteo
    name: Vigilance météo
    icon: mdi:alert-outline
    icons: {Vert: mdi:shield-check-outline}
    colors: {Vert: "#2f9e5a", Jaune: "#d9a400", Orange: "#f07a2c", Rouge: "#e5484d"}
    secondary: "pluie {sensor.probabilite_pluie:0} % · UV {sensor.indice_uv:0}"

alerts:
  battery: false   # seuils propres à chaque pile ci-dessous
  updates: false   # seule la mise à jour du serveur de fichiers est suivie
  rules:
    - {entity: climate.poele, state: unavailable, level: na, title: "Poêle à granulés indisponible", text: "L'intégration ne répond plus : vérifier son Wi-Fi avant les premiers froids."}
    - {entity: media_player.tv_chambre, state: unavailable, level: na, title: "TV chambre indisponible", text: "media_player.tv_chambre ne répond pas."}
    - {entity: binary_sensor.porte_entree_contact, state: "on", title: "Porte d'entrée ouverte", text: "Depuis {since}."}
    - {entity: binary_sensor.baie_sejour, state: "on", title: "Baie du séjour ouverte"}
    - {entity: binary_sensor.porte_abri, state: "on", title: "Porte de l'abri ouverte"}
    - {entity: sensor.serveur_memoire, above: 90, title: "Serveur à {value:0} % de mémoire", text: "Machine virtuelle Home Assistant."}
    - {entity: sensor.passerelle_radio_temperature, above: 70, title: "Passerelle radio à {state}", text: "Puce principale chaude."}
    - {entity: sensor.coordinateur_zigbee_connexion, state: wifi, title: "Coordinateur Zigbee en Wi-Fi", text: "Ethernet débranché sur le coordinateur Zigbee."}
    - {entity: update.serveur_fichiers, state: "on", title: "Serveur de fichiers : mise à jour disponible"}
    - {entity: sensor.sejour_batterie, below: 40, level: info, title: "Pile du capteur séjour à {value:0} %"}
    - {entity: sensor.vanne_arrosage_batterie, below: 30, level: info, title: "Pile de la vanne d'arrosage à {value:0} %"}
    - {entity: sensor.salle_de_bain_humidite, above: 80, level: info, title: "Humidité salle de bain à {state}"}
